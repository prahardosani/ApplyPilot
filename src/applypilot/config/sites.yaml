# Direct career site registry for ApplyPilot - Australia starter
#
# Phase 1 deliberately keeps this list empty. The reliable AU discovery path is:
#   1. JobSpy boards that support Australia: Indeed, LinkedIn, Glassdoor
#   2. Workday employers in employers.yaml
#
# Add direct sites only after testing one site at a time. SEEK is intentionally
# not listed here because it is not a JobSpy-supported board and needs a
# dedicated tested importer/scraper.

manual_ats:
  - "ibegin.tcsapps.com"

blocked:
  sites:
    - "glassdoor"
    - "google"
  url_patterns:
    - "%glassdoor%"
    - "%google.com/about/careers%"
    - "%google.jobs%"

blocked_sso:
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "okta.com"
  - "auth0.com"

base_urls: {}

sites: []
