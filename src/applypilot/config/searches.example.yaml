# ApplyPilot search configuration - Australia starter
# Copy to ~/.applypilot/searches.yaml and customise for the candidate.
#
# SEEK is not a JobSpy board. It has its own discovery module
# (discovery/seek.py) configured in the `seek:` block below.

defaults:
  country_indeed: "Australia"
  results_per_site: 50
  hours_old: 72

# SEEK discovery (discovery only - never logs in or applies).
seek:
  enabled: true
  pages_per_query: 2
  days_old: 3
  delay_seconds: 2.0
  max_tier: 2
  # where_map:            # optional overrides: location label -> SEEK "where"
  #   sydney: "All Sydney NSW"

# JobSpy source boards. Keep ZipRecruiter out of AU defaults because it is
# US/Canada-focused in JobSpy. Google can work, but usually needs very specific
# search strings, so it is not enabled by default.
sites:
  - indeed
  - linkedin
  - glassdoor

queries:
  # Tier 1: closest matches
  - query: "graduate environmental scientist"
    tier: 1
  - query: "environmental consultant"
    tier: 1
  - query: "environmental officer"
    tier: 1
  - query: "sustainability analyst"
    tier: 1

  # Tier 2: adjacent roles
  - query: "environmental advisor"
    tier: 2
  - query: "ecologist"
    tier: 2
  - query: "water quality officer"
    tier: 2
  - query: "contaminated land consultant"
    tier: 2
  - query: "ESG analyst"
    tier: 2

  # Tier 3: broader net
  - query: "environmental science"
    tier: 3
  - query: "climate analyst"
    tier: 3
  - query: "planning environmental"
    tier: 3
  - query: "waste management officer"
    tier: 3

locations:
  - label: sydney
    location: "Sydney NSW"
    remote: false
  - label: melbourne
    location: "Melbourne VIC"
    remote: false
  - label: brisbane
    location: "Brisbane QLD"
    remote: false
  - label: canberra
    location: "Canberra ACT"
    remote: false
  - label: remote_au
    location: "Remote Australia"
    remote: true

# Location filtering is used after discovery and before auto-apply.
location_accept:
  - "Sydney"
  - "Melbourne"
  - "Brisbane"
  - "Canberra"
  - "New South Wales"
  - "NSW"
  - "Victoria"
  - "VIC"
  - "Queensland"
  - "QLD"
  - "ACT"
  - "Australia"
  - "Remote"
  - "Hybrid"
  - "Work from home"

location_reject_non_remote:
  - "United States"
  - "USA"
  - "Canada"
  - "India"
  - "Philippines"
  - "United Kingdom"
  - "UK"
  - "Singapore"
  - "New Zealand"

# Optional controls
workday_max_tier: 2
workday_location_filter: true

# Negative title keywords - skip jobs with these in the title.
exclude_titles:
  - "senior manager"
  - "director"
  - "head of"
  - "principal"
  - "lead "
  - "intern"
  - "internship"
  - "volunteer"
  - "unpaid"
  - "mining engineer"
  - "software"
