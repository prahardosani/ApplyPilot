# Workday employer registry for ApplyPilot — AU edition (au-localization branch)
#
# Note: most large AU environmental consultancies (Jacobs, AECOM, GHD, WSP, Stantec, ERM)
# DO NOT use Workday — they use Taleo, iCIMS, SuccessFactors, or custom systems.
# Those companies are still picked up via LinkedIn / Indeed / Seek discovery.
#
# To add an employer here:
#   1. Visit their careers page
#   2. Search the page source / URL for `wd[N].myworkdayjobs.com`
#   3. The structure is `https://[tenant].wd[N].myworkdayjobs.com/[site_id]`
#   4. Add an entry below with tenant, site_id, and base_url

employers:

  # ── Telco & Media ────────────────────────────────────────────────────────
  telstra:
    name: "Telstra"
    tenant: "telstra"
    site_id: "Telstra_Careers"
    base_url: "https://telstra.wd3.myworkdayjobs.com"

  # ── Property / Real Estate (strong sustainability hiring) ────────────────
  lendlease:
    name: "Lendlease"
    tenant: "lendlease"
    site_id: "lendleasecareers"
    base_url: "https://lendlease.wd3.myworkdayjobs.com"

  # ── Engineering / Defence ────────────────────────────────────────────────
  kbr:
    name: "KBR"
    tenant: "kbr"
    site_id: "KBR_Careers"
    base_url: "https://kbr.wd5.myworkdayjobs.com"

  # ── Universities (research / graduate roles in env sciences) ─────────────
  macquarie_university:
    name: "Macquarie University"
    tenant: "mq"
    site_id: "CareersatMQ"
    base_url: "https://mq.wd3.myworkdayjobs.com"

  # ── Banks (NZ-hosted tenant; some AU roles cross-listed) ─────────────────
  westpac_nz:
    name: "Westpac (NZ tenant)"
    tenant: "westpacnz"
    site_id: "Westpac_Careers"
    base_url: "https://westpacnz.wd105.myworkdayjobs.com"
